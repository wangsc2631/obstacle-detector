<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>守護眼 · 失智自動播報</title>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.15.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.2/dist/coco-ssd.min.js"></script>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}
:root {
  --bg: #0a0f1e;
  --surface: #121929;
  --surface2: #1a2540;
  --accent: #00e5ff;
  --accent2: #ff6b35;
  --accent3: #a8ff3e;
  --danger: #ff4757;
  --text: #e8f0fe;
  --text-dim: #7a8ba8;
  --radius: 18px;
}
html, body {
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
}
#loadScreen {
  position: fixed;
  inset: 0;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 999;
}
.load-emoji { font-size: 64px; margin-bottom: 12px; }
.load-title { font-size: 26px; font-weight: 900; color: var(--accent); margin-bottom: 6px; }
.load-msg { color: var(--text-dim); font-size: 14px; margin-bottom: 24px; padding: 0 20px; text-align: center; }
.load-bar { width: 220px; height: 5px; background: var(--surface2); border-radius: 3px; overflow: hidden; }
.load-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent3)); width: 0%; transition: width 0.4s; }
.load-err { color: var(--danger); font-size: 13px; margin-top: 12px; display: none; text-align: center; padding: 0 20px; }

#modeScreen {
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 30px 20px;
  background: radial-gradient(ellipse at top, #1a2540, #0a0f1e);
}
#modeScreen h1 { font-size: 30px; font-weight: 900; color: var(--accent); margin-bottom: 4px; }
#modeScreen p { color: var(--text-dim); font-size: 14px; margin-bottom: 36px; text-align: center; }
.mode-btn {
  width: 100%;
  max-width: 340px;
  padding: 22px 20px;
  border: none;
  border-radius: var(--radius);
  font-size: 20px;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 14px;
  margin-bottom: 14px;
  color: white;
  transition: transform 0.12s;
}
.mode-btn:active { transform: scale(0.96); }
.mode-btn .desc { font-size: 12px; font-weight: 400; opacity: 0.85; margin-top: 3px; display: block; }
.mb-blind { background: linear-gradient(135deg, #0066ff, #003cbb); box-shadow: 0 8px 30px rgba(0,102,255,0.35); }
.mb-dementia { background: linear-gradient(135deg, #e040fb, #9c27b0); box-shadow: 0 8px 30px rgba(224,64,251,0.35); }

#mainApp {
  display: none;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}
.cam-wrap {
  position: relative;
  width: 100%;
  flex-shrink: 0;
  background: #000;
  overflow: hidden;
}
#video {
  width: 100%;
  height: 56vw;
  max-height: 300px;
  object-fit: cover;
  display: block;
}
#canvas {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}
.zone-overlay {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  display: none;
  pointer-events: none;
}
.zone-label {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  font-size: 11px;
  font-weight: 700;
  padding: 4px 8px;
  border-radius: 10px;
  backdrop-filter: blur(4px);
}
.zl-left { left: 4px; background: rgba(0,102,255,0.5); color: #aad4ff; }
.zl-center { left: 50%; transform: translate(-50%, -50%); background: rgba(0,229,255,0.3); color: #aaf8ff; }
.zl-right { right: 4px; background: rgba(255,107,53,0.5); color: #ffd0b8; }
.status-bar {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  background: linear-gradient(transparent, rgba(0,0,0,0.8));
  padding: 6px 10px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 11px;
}
.rec-dot { width: 7px; height: 7px; border-radius: 50%; background: #555; display: inline-block; margin-right: 4px; }
.rec-dot.on { background: var(--danger); animation: blink 1s infinite; }
.mode-chip { padding: 3px 10px; border-radius: 10px; font-size: 11px; font-weight: 700; }
.chip-blind { background: rgba(0,102,255,0.6); color: #aad4ff; }
.chip-dementia { background: rgba(224,64,251,0.6); color: #f0aaff; }
.voice-box {
  margin: 10px 10px 6px;
  background: var(--surface);
  border-radius: 14px;
  padding: 12px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  border: 1px solid rgba(0,229,255,0.2);
  flex-shrink: 0;
}
.v-icon { font-size: 24px; flex-shrink: 0; }
.v-icon.speaking { animation: pulse 0.6s infinite; }
.v-text { font-size: 15px; line-height: 1.4; flex: 1; }
.content-area {
  flex: 1;
  overflow-y: auto;
  padding: 0 10px 10px;
  -webkit-overflow-scrolling: touch;
}

/* 盲人 UI */
.spatial-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-bottom: 8px; }
.sp-cell { background: var(--surface); border-radius: 12px; padding: 10px 6px; text-align: center; }
.sp-cell.mid { background: rgba(0,229,255,0.07); border: 1px solid rgba(0,229,255,0.2); }
.sp-dir { font-size: 10px; color: var(--text-dim); margin-bottom: 4px; }
.sp-val { font-size: 13px; font-weight: 700; color: var(--accent); min-height: 18px; word-break: break-word; }
.warn-bar { background: rgba(255,71,87,0.15); border: 1px solid rgba(255,71,87,0.5); border-radius: 12px; padding: 10px 14px; margin-bottom: 8px; display: none; align-items: center; gap: 8px; }
.warn-bar.show { display: flex; }
.warn-txt { font-size: 14px; font-weight: 700; color: var(--danger); }
.info-row { background: var(--surface); border-radius: 12px; padding: 10px 14px; margin-bottom: 8px; display: flex; align-items: center; gap: 10px; }
.ir-icon { font-size: 20px; flex-shrink: 0; }
.ir-label { font-size: 11px; color: var(--text-dim); }
.ir-val { font-size: 14px; font-weight: 700; }
.ir-val.green { color: var(--accent3); }
.ir-val.yellow { color: #ffd700; }
.ir-val.cyan { color: var(--accent); }
.btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
.act-btn {
  padding: 16px 8px;
  border: none;
  border-radius: 14px;
  font-size: 15px;
  font-weight: 700;
  color: white;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  min-height: 80px;
  transition: transform 0.12s;
}
.act-btn:active { transform: scale(0.94); }
.act-btn .bi { font-size: 26px; }
.btn-go { background: linear-gradient(135deg, #00c853, #00a040); box-shadow: 0 4px 16px rgba(0,200,83,0.35); }
.btn-stop { background: linear-gradient(135deg, #ff4757, #c0392b); box-shadow: 0 4px 16px rgba(255,71,87,0.35); }
.btn-nav { background: linear-gradient(135deg, #0066ff, #003cbb); box-shadow: 0 4px 16px rgba(0,102,255,0.35); }
.btn-ask { background: linear-gradient(135deg, #9c27b0, #e040fb); box-shadow: 0 4px 16px rgba(156,39,176,0.35); }
.btn-sos { background: linear-gradient(135deg, #ff6b35, #e64a19); box-shadow: 0 4px 16px rgba(255,107,53,0.35); }
.bottom-bar {
  display: flex;
  gap: 8px;
  padding: 10px 10px 20px;
  background: rgba(10,15,30,0.97);
  border-top: 1px solid rgba(255,255,255,0.07);
  flex-shrink: 0;
}
.bb-btn {
  flex: 1;
  padding: 12px 4px;
  border: none;
  border-radius: 13px;
  color: white;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  transition: transform 0.12s;
}
.bb-btn:active { transform: scale(0.94); }
.bb-btn .bico { font-size: 20px; }
.bb-mic { background: linear-gradient(135deg, #5c6bc0, #3949ab); }
.bb-mic.on { background: linear-gradient(135deg, #00c853, #00a040); }
.bb-ask { background: linear-gradient(135deg, #9c27b0, #e040fb); }
.bb-loc { background: linear-gradient(135deg, #0066ff, #003cbb); }
.bb-back { background: var(--surface2); }
.bb-voice { background: linear-gradient(135deg, #ff6b35, #e64a19); }

/* 失智 UI */
.family-sect { background: var(--surface); border-radius: 14px; margin-bottom: 8px; overflow: hidden; border: 1px solid rgba(224,64,251,0.2); }
.family-head { background: rgba(224,64,251,0.1); padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; }
.family-head h3 { font-size: 15px; font-weight: 700; }
.add-fam-btn { background: rgba(224,64,251,0.25); border: none; color: white; padding: 5px 12px; border-radius: 10px; font-size: 13px; cursor: pointer; }
.fam-grid { padding: 10px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.fam-card { background: var(--surface2); border-radius: 12px; padding: 10px 6px; text-align: center; border: 2px solid transparent; cursor: pointer; }
.fam-photo { width: 58px; height: 58px; border-radius: 50%; margin: 0 auto 6px; overflow: hidden; background: var(--surface); display: flex; align-items: center; justify-content: center; font-size: 26px; border: 2px solid rgba(255,255,255,0.1); }
.fam-photo img { width: 100%; height: 100%; object-fit: cover; }
.fam-name { font-size: 13px; font-weight: 700; }
.fam-rel { font-size: 10px; color: var(--text-dim); margin-top: 2px; }
.add-card { border: 2px dashed rgba(255,255,255,0.12); }
.result-sect { background: var(--surface); border-radius: 14px; margin-bottom: 8px; padding: 12px 14px; }
.result-sect h3 { font-size: 12px; color: var(--text-dim); margin-bottom: 8px; letter-spacing: 1px; }
.item-row { display: flex; align-items: center; gap: 8px; background: var(--surface2); border-radius: 10px; padding: 9px 12px; margin-bottom: 6px; cursor: pointer; }
.item-row:last-child { margin-bottom: 0; }
.item-emoji { font-size: 18px; flex-shrink: 0; }
.item-name { flex: 1; font-size: 15px; font-weight: 700; }
.item-pos { font-size: 11px; padding: 2px 7px; border-radius: 8px; font-weight: 700; }
.pos-left { background: rgba(0,102,255,0.25); color: #88bbff; }
.pos-center { background: rgba(0,229,255,0.2); color: var(--accent); }
.pos-right { background: rgba(255,107,53,0.25); color: #ffaa88; }
.item-pct { font-size: 11px; color: var(--text-dim); }
.api-section { background: var(--surface); border-radius: 14px; margin-bottom: 8px; padding: 12px 14px; border: 1px solid rgba(0,229,255,0.15); }
.api-section h3 { font-size: 12px; color: var(--text-dim); margin-bottom: 8px; }
.api-row { display: flex; gap: 8px; align-items: center; }
.api-inp { flex: 1; background: var(--surface2); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 9px 12px; color: var(--text); font-size: 13px; }
.api-save-btn { background: var(--accent); border: none; border-radius: 10px; padding: 9px 14px; color: #000; font-size: 13px; font-weight: 700; cursor: pointer; }
#famModal { display: none; position: fixed; inset: 0; z-index: 200; background: rgba(0,0,0,0.85); align-items: flex-end; justify-content: center; }
#famModal.open { display: flex; }
.modal-box { background: var(--surface); border-radius: 22px 22px 0 0; width: 100%; max-width: 480px; padding: 22px 18px 40px; }
.modal-box h2 { font-size: 19px; font-weight: 900; }
.ph-preview { width: 90px; height: 90px; border-radius: 50%; background: var(--surface2); border: 2px dashed rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; margin: 0 auto 14px; cursor: pointer; overflow: hidden; font-size: 32px; }
.ph-preview img { width: 100%; height: 100%; object-fit: cover; }
.inp { width: 100%; background: var(--surface2); border: 1px solid rgba(255,255,255,0.1); border-radius: 11px; padding: 11px 13px; color: var(--text); font-size: 16px; margin-bottom: 12px; }
.modal-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
.m-cancel { background: var(--surface2); border: none; border-radius: 12px; padding: 13px; color: var(--text); font-weight: 700; }
.m-save { background: linear-gradient(135deg, #e040fb, #9c27b0); border: none; border-radius: 12px; padding: 13px; color: white; font-weight: 700; }
#fileInput { display: none; }
.sp { height: 80px; }
@keyframes blink { 0%,100%{ opacity:1 } 50%{ opacity:0 } }
@keyframes pulse { 0%,100%{ transform:scale(1) } 50%{ transform:scale(1.18) } }
</style>
</head>
<body>

<div id="loadScreen">
  <div class="load-emoji">👁️</div>
  <div class="load-title">守護眼 · 手機版</div>
  <div class="load-msg" id="loadMsg">正在初始化，請允許相機權限</div>
  <div class="load-bar"><div class="load-fill" id="loadFill"></div></div>
  <div class="load-err" id="loadErr"></div>
</div>

<div id="modeScreen" style="display:none;">
  <div style="font-size:52px;margin-bottom:8px;">👁️</div>
  <h1>守護眼</h1>
  <p>請選擇使用模式</p>
  <button class="mode-btn mb-blind" onclick="selectMode('blind')">
    <span style="font-size:34px;">🦯</span>
    <div style="text-align:left;">盲人輔助模式<span class="desc">語音控制 · 空間感知 · 可主動詢問物品</span></div>
  </button>
  <button class="mode-btn mb-dementia" onclick="selectMode('dementia')">
    <span style="font-size:34px;">🌸</span>
    <div style="text-align:left;">失智照護模式<span class="desc">自動播報環境 · 不需操作 · 被動提醒</span></div>
  </button>
  <div style="width:100%;max-width:340px;margin-top:10px;">
    <div class="api-section">
      <h3>🔑 Anthropic API Key（選填，啟用AI自動環境描述）</h3>
      <div class="api-row">
        <input class="api-inp" type="password" id="apiKeyInp" placeholder="sk-ant-..." value="">
        <button class="api-save-btn" onclick="saveApiKey()">儲存</button>
      </div>
      <div style="font-size:11px;color:var(--text-dim);margin-top:6px;">有API Key時，失智模式會每30秒自動溫柔播報環境中的物品與家人位置</div>
    </div>
  </div>
</div>

<div id="mainApp" style="display:none;">
  <div class="cam-wrap">
    <video id="video" autoplay playsinline muted webkit-playsinline></video>
    <canvas id="canvas"></canvas>
    <div class="zone-overlay" id="zoneOverlay">
      <div class="zone-label zl-left">◀ 左</div>
      <div class="zone-label zl-center">前方</div>
      <div class="zone-label zl-right">右 ▶</div>
    </div>
    <div class="status-bar">
      <div><span class="rec-dot" id="recDot"></span><span id="recTxt">待機</span></div>
      <div class="mode-chip" id="modeChip">─</div>
      <div id="camInfo">─</div>
    </div>
  </div>
  <div class="voice-box">
    <div class="v-icon" id="vIcon">🔊</div>
    <div class="v-text" id="vText">系統就緒</div>
  </div>
  <div class="content-area" id="contentArea">
    <!-- 盲人 UI -->
    <div id="blindUI" style="display:none;">
      <div class="spatial-grid">
        <div class="sp-cell"><div class="sp-dir">◀ 左側</div><div class="sp-val" id="spL">—</div></div>
        <div class="sp-cell mid"><div class="sp-dir">▲ 前方</div><div class="sp-val" id="spC">—</div></div>
        <div class="sp-cell"><div class="sp-dir">右側 ▶</div><div class="sp-val" id="spR">—</div></div>
      </div>
      <div class="warn-bar" id="warnBar"><span style="font-size:22px;animation:blink 0.5s infinite;">⚠️</span><span class="warn-txt" id="warnTxt">前方有障礙！</span></div>
      <div class="info-row"><span class="ir-icon">🟡</span><div><div class="ir-label">導盲磚偵測</div><div class="ir-val yellow" id="tactile">偵測中...</div></div></div>
      <div class="info-row"><span class="ir-icon">🚶</span><div><div class="ir-label">前方人物跟隨</div><div class="ir-val green" id="personTrk">未偵測到人物</div></div></div>
      <div class="btn-grid">
        <button class="act-btn btn-go" id="startBtn" onclick="toggleRunning()"><span class="bi">▶️</span><span>開始辨識</span></button>
        <button class="act-btn btn-nav" id="navBtn" onclick="toggleNav()"><span class="bi">🏠</span><span>導航回家</span></button>
        <button class="act-btn btn-ask" onclick="startAskVoice()"><span class="bi">🤖</span><span>問物品</span></button>
        <button class="act-btn btn-sos" onclick="sos()"><span class="bi">🆘</span><span>緊急呼救</span></button>
      </div>
      <div class="sp"></div>
    </div>
    <!-- 失智 UI -->
    <div id="dementiaUI" style="display:none;">
      <div class="family-sect"><div class="family-head"><h3>👨‍👩‍👧 家人識別</h3><button class="add-fam-btn" onclick="openModal()">＋ 新增家人</button></div><div class="fam-grid" id="famGrid"></div></div>
      <div class="result-sect"><h3>🔍 即時辨識 (80類基礎)</h3><div id="itemList"><div class="item-row"><span>⏳ 等待辨識...</span></div></div></div>
      <div class="result-sect" id="aiAutoBox" style="display:none;"><h3>🤖 自動環境描述 (每30秒)</h3><div id="aiAutoText" style="font-size:14px;color:var(--accent3);"></div></div>
      <div style="margin-top:8px; display:flex; gap:8px;">
        <button class="act-btn btn-rep" style="flex:1; min-height:auto; padding:12px;" onclick="repeatLastAutoMsg()"><span class="bi">🔁</span><span>重複最後播報</span></button>
        <button class="act-btn btn-sos" style="flex:1; min-height:auto; padding:12px;" onclick="sos()"><span class="bi">🆘</span><span>緊急呼救</span></button>
      </div>
    </div>
  </div>
  <div class="bottom-bar">
    <button class="bb-btn bb-mic" id="micBtn" onclick="toggleVoice()"><span class="bico">🎤</span>語音指令</button>
    <button class="bb-btn bb-loc" onclick="setHome()"><span class="bico">📍</span>設定家</button>
    <button class="bb-btn bb-voice" onclick="toggleMute()"><span class="bico">🔊</span><span>語音開</span></button>
    <button class="bb-btn bb-back" onclick="backToMode()"><span class="bico">↩️</span>換模式</button>
  </div>
</div>

<div id="famModal"><div class="modal-box"><h2>新增家人</h2><p>拍一張家人照片</p><div class="ph-preview" id="phPrev" onclick="document.getElementById('fileInput').click()">📷</div><input type="file" id="fileInput" accept="image/*" capture="environment" onchange="handlePhoto(event)"><input class="inp" type="text" id="famName" placeholder="稱呼（例：媽媽）"><input class="inp" type="text" id="famRel" placeholder="關係"><div class="modal-btns"><button class="m-cancel" onclick="closeModal()">取消</button><button class="m-save" onclick="saveFam()">儲存</button></div></div></div>

<script>
// ======================== 全域狀態 ========================
const S = {
  mode: null, model: null, stream: null, running: false, muted: false,
  voiceOn: false, voiceRec: null, homePos: null, navigating: false, watchId: null,
  lastSpeak: 0, cooldown: 2800, apiKey: '', family: [], tempPhoto: null,
  personSeen: false, lastAutoMsg: '', autoTimer: null
};

window.addEventListener('DOMContentLoaded', async () => {
  S.apiKey = localStorage.getItem('apiKey') || '';
  S.homePos = JSON.parse(localStorage.getItem('homePos') || 'null');
  S.family = JSON.parse(localStorage.getItem('family') || '[]');
  if (document.getElementById('apiKeyInp')) document.getElementById('apiKeyInp').value = S.apiKey;
  prog(12, '載入 AI 模型...');
  try {
    prog(30, '載入 COCO-SSD (80類基礎)');
    S.model = await cocoSsd.load();
    prog(65, '啟動相機 (請允許權限)');
    const ok = await startCamera();
    if (!ok) {
      let errMsg = '相機啟動失敗。\n⚠️ 請確認：\n1. 使用 HTTPS 連線 (例如 GitHub Pages)\n2. 手機已允許相機權限\n3. 重新整理頁面並點擊「允許」';
      showErr(errMsg);
      return;
    }
    prog(100, '就緒！');
    setTimeout(() => {
      document.getElementById('loadScreen').style.display = 'none';
      document.getElementById('modeScreen').style.display = 'flex';
    }, 500);
  } catch(e) {
    showErr('初始化失敗：' + e.message + '\n請重新整理，並確保使用 HTTPS');
    console.error(e);
  }
});

function prog(pct, msg) {
  const f = document.getElementById('loadFill');
  if (f) f.style.width = pct + '%';
  const m = document.getElementById('loadMsg');
  if (m) m.textContent = msg;
}
function showErr(msg) {
  const e = document.getElementById('loadErr');
  e.textContent = msg;
  e.style.display = 'block';
  document.getElementById('loadFill').style.width = '100%';
}

async function startCamera() {
  const video = document.getElementById('video');
  if (video.srcObject) return true;
  // 檢查是否為安全環境 (HTTPS 或 localhost)
  if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
    showErr('⚠️ 非安全環境：請使用 HTTPS 連線才能啟用相機。\n您可以將此檔案上傳至 GitHub Pages 或使用本地伺服器。');
    return false;
  }
  const constraintsList = [
    { video: { facingMode: { exact: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } } },
    { video: { facingMode: 'environment' } },
    { video: true }
  ];
  for (const c of constraintsList) {
    try {
      const stream = await navigator.mediaDevices.getUserMedia(c);
      video.srcObject = stream;
      S.stream = stream;
      await new Promise((resolve) => {
        video.onloadedmetadata = () => { video.play().then(resolve).catch(resolve); };
        setTimeout(resolve, 3000);
      });
      document.getElementById('camInfo').textContent = stream.getVideoTracks()[0]?.label.slice(0, 20) || '相機';
      return true;
    } catch (e) {
      console.warn('相機嘗試失敗:', e);
    }
  }
  return false;
}

function saveApiKey() {
  S.apiKey = document.getElementById('apiKeyInp').value.trim();
  localStorage.setItem('apiKey', S.apiKey);
  alert(S.apiKey ? 'API Key 已儲存！失智模式將啟動自動環境描述。' : '已清除 API Key');
}

function selectMode(mode) {
  S.mode = mode;
  stopRunning();
  if (S.navigating) stopNav();
  stopVoiceRec();
  if (S.autoTimer) { clearInterval(S.autoTimer); S.autoTimer = null; }
  document.getElementById('modeScreen').style.display = 'none';
  document.getElementById('mainApp').style.display = 'flex';
  const chip = document.getElementById('modeChip');
  if (mode === 'blind') {
    chip.textContent = '🦯 盲人';
    chip.className = 'mode-chip chip-blind';
    document.getElementById('blindUI').style.display = 'block';
    document.getElementById('dementiaUI').style.display = 'none';
    document.getElementById('zoneOverlay').style.display = 'flex';
    say('盲人模式，可使用「問物品」主動詢問任何東西', true);
    setTimeout(() => startRunning(), 1500);
  } else {
    chip.textContent = '🌸 失智';
    chip.className = 'mode-chip chip-dementia';
    document.getElementById('blindUI').style.display = 'none';
    document.getElementById('dementiaUI').style.display = 'block';
    document.getElementById('zoneOverlay').style.display = 'none';
    renderFam();
    say('失智照護模式啟動，系統將自動提醒環境中的物品與家人，您不需操作', true);
    setTimeout(() => startRunning(), 1500);
    if (S.apiKey) {
      S.autoTimer = setInterval(() => { if (S.running && S.mode === 'dementia') autoDescribeScene(); }, 30000);
    } else {
      document.getElementById('aiAutoBox').style.display = 'none';
    }
  }
}

function backToMode() {
  stopRunning();
  if (S.navigating) stopNav();
  stopVoiceRec();
  if (S.autoTimer) { clearInterval(S.autoTimer); S.autoTimer = null; }
  // 釋放相機資源
  if (S.stream) {
    S.stream.getTracks().forEach(track => track.stop());
    S.stream = null;
    document.getElementById('video').srcObject = null;
  }
  document.getElementById('mainApp').style.display = 'none';
  document.getElementById('modeScreen').style.display = 'flex';
  S.mode = null;
}

function say(msg, force = false) {
  const vText = document.getElementById('vText');
  if (vText) vText.textContent = msg;
  if (S.muted) return;
  const now = Date.now();
  if (!force && now - S.lastSpeak < S.cooldown) return;
  S.lastSpeak = now;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(msg);
  utter.lang = 'zh-TW';
  utter.rate = 0.92;
  const icon = document.getElementById('vIcon');
  if (icon) {
    utter.onstart = () => icon.className = 'v-icon speaking';
    utter.onend = () => icon.className = 'v-icon';
  }
  window.speechSynthesis.speak(utter);
}

function toggleMute() {
  S.muted = !S.muted;
  const icon = document.querySelector('.bb-voice .bico');
  if (icon) icon.textContent = S.muted ? '🔇' : '🔊';
  if (S.muted) window.speechSynthesis.cancel();
}

// 基礎辨識相關
const COCO = { 'person':'人','bicycle':'腳踏車','car':'汽車','motorcycle':'摩托車','bus':'公車','truck':'卡車','traffic light':'紅綠燈','dog':'狗','cat':'貓','chair':'椅子','couch':'沙發','bed':'床','bottle':'瓶子','cup':'杯子','bowl':'碗','apple':'蘋果','banana':'香蕉','pizza':'披薩','cell phone':'手機','laptop':'筆電','tv':'電視','book':'書','clock':'時鐘','backpack':'背包','umbrella':'雨傘' };
const ICONS = { 'person':'👤','car':'🚗','dog':'🐕','cat':'🐈','chair':'🪑','bottle':'🍾','apple':'🍎','cell phone':'📱' };
function getName(cls) { return COCO[cls] || cls; }
function getIcon(cls) { return ICONS[cls] || '📦'; }
function getPos(bbox, vw) { const cx = bbox[0] + bbox[2] / 2; const r = cx / vw; if (r < 0.33) return 'left'; if (r > 0.66) return 'right'; return 'center'; }

let recLoop = null;
function startRunning() { if (S.running) return; S.running = true; document.getElementById('recDot').className = 'rec-dot on'; document.getElementById('recTxt').textContent = '辨識中'; loop(); }
function stopRunning() { S.running = false; if (recLoop) { clearTimeout(recLoop); recLoop = null; } document.getElementById('recDot').className = 'rec-dot'; document.getElementById('recTxt').textContent = '待機'; }
function toggleRunning() { S.running ? stopRunning() : startRunning(); }

async function loop() {
  if (!S.running) return;
  const video = document.getElementById('video');
  if (video.readyState >= 2 && S.model) {
    try {
      const preds = await S.model.detect(video);
      drawBoxes(preds);
      const items = preds.filter(p => p.score > 0.42).map(p => ({ name: getName(p.class), cls: p.class, score: p.score, bbox: p.bbox, pos: getPos(p.bbox, video.videoWidth || 640), distRatio: p.bbox[3] / (video.videoHeight || 480) }));
      if (S.mode === 'blind') processBlind(items);
      else processDementia(items);
    } catch (e) { console.warn(e); }
  }
  recLoop = setTimeout(() => loop(), S.mode === 'blind' ? 500 : 1000);
}

function drawBoxes(preds) {
  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const dw = video.clientWidth, dh = video.clientHeight;
  const vw = video.videoWidth || dw, vh = video.videoHeight || dh;
  canvas.width = dw; canvas.height = dh;
  ctx.clearRect(0, 0, dw, dh);
  const sx = dw / vw, sy = dh / vh;
  preds.filter(p => p.score > 0.4).forEach(p => {
    const [bx, by, bw, bh] = p.bbox;
    const x = bx * sx, y = by * sy, w = bw * sx, h = bh * sy;
    const col = getPos(p.bbox, vw) === 'left' ? '#4488ff' : (getPos(p.bbox, vw) === 'right' ? '#ff6b35' : '#00e5ff');
    ctx.strokeStyle = col;
    ctx.lineWidth = 2.5;
    ctx.strokeRect(x, y, w, h);
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    const lbl = `${getName(p.class)} ${Math.round(p.score * 100)}%`;
    ctx.font = 'bold 11px sans-serif';
    const tw = ctx.measureText(lbl).width;
    ctx.fillRect(x, y - 18, tw + 8, 17);
    ctx.fillStyle = col;
    ctx.fillText(lbl, x + 4, y - 7);
  });
}

function processBlind(items) {
  const left = items.filter(i => i.pos === 'left'), center = items.filter(i => i.pos === 'center'), right = items.filter(i => i.pos === 'right');
  document.getElementById('spL').textContent = left.map(i => i.name).join(' ') || '—';
  document.getElementById('spC').textContent = center.map(i => i.name).join(' ') || '—';
  document.getElementById('spR').textContent = right.map(i => i.name).join(' ') || '—';
  const people = items.filter(i => i.cls === 'person');
  if (people.length) { document.getElementById('personTrk').textContent = '正前方有人，可跟隨'; if (!S.personSeen) { S.personSeen = true; say('偵測到前方有人'); } }
  else { if (S.personSeen) say('前方人物已離開'); S.personSeen = false; document.getElementById('personTrk').textContent = '未偵測到人物'; }
}

function processDementia(items) {
  const listDiv = document.getElementById('itemList');
  if (!items.length) { listDiv.innerHTML = '<div class="item-row"><span>🔍 未辨識到物品</span></div>'; return; }
  const html = items.slice(0, 6).map(it => `<div class="item-row" onclick="say('這是${it.name}', true)"><span class="item-emoji">${getIcon(it.cls)}</span><span class="item-name">${it.name}</span><span class="item-pos ${it.pos === 'left' ? 'pos-left' : (it.pos === 'right' ? 'pos-right' : 'pos-center')}">${it.pos === 'left' ? '◀左' : (it.pos === 'right' ? '右▶' : '▲前')}</span><span class="item-pct">${Math.round(it.score * 100)}%</span></div>`).join('');
  listDiv.innerHTML = html;
}

// 失智模式自動描述
async function autoDescribeScene() {
  if (!S.apiKey) return;
  const video = document.getElementById('video');
  if (!video || video.readyState < 2) return;
  const canvas = document.createElement('canvas');
  const w = 640, h = Math.round(640 * video.videoHeight / (video.videoWidth || 640));
  canvas.width = w; canvas.height = h;
  canvas.getContext('2d').drawImage(video, 0, 0, w, h);
  const b64 = canvas.toDataURL('image/jpeg', 0.7).split(',')[1];
  const prompt = `你是一個失智照護輔助工具。請用溫柔、簡潔的繁體中文描述畫面中出現的物品和位置（左/正前/右）。如果有家人（根據平常家人照片判斷），請直接稱呼他們的關係（例如「媽媽在左邊」）。總共2~3句話，語氣溫暖。`;
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-api-key': S.apiKey, 'anthropic-version': '2023-06-01' },
      body: JSON.stringify({ model: 'claude-3-haiku-20240307', max_tokens: 200, messages: [{ role: 'user', content: [{ type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: b64 } }, { type: 'text', text: prompt }] }] })
    });
    if (!res.ok) return;
    const data = await res.json();
    const description = data.content?.[0]?.text || '';
    if (description) {
      S.lastAutoMsg = description;
      const box = document.getElementById('aiAutoBox');
      if (box) { box.style.display = 'block'; document.getElementById('aiAutoText').innerHTML = `💬 ${description}`; }
      say(description, true);
    }
  } catch (e) { console.warn(e); }
}
function repeatLastAutoMsg() { if (S.lastAutoMsg) say(S.lastAutoMsg, true); else say('尚無自動播報記錄', true); }

// 盲人模式主動詢問
async function startAskVoice() {
  if (S.mode !== 'blind') { say('此功能僅在盲人模式可用', true); return; }
  if (!S.apiKey) { say('請先設定 Anthropic API Key', true); return; }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { say('不支援語音輸入', true); return; }
  const askRec = new SR();
  askRec.lang = 'zh-TW';
  askRec.continuous = false;
  askRec.onstart = () => say('請說出你想詢問的物品', true);
  askRec.onresult = async (e) => {
    const question = e.results[0][0].transcript;
    say(`詢問：${question}`, true);
    const video = document.getElementById('video');
    const canvas = document.createElement('canvas');
    const w = 640, h = Math.round(640 * video.videoHeight / (video.videoWidth || 640));
    canvas.width = w; canvas.height = h;
    canvas.getContext('2d').drawImage(video, 0, 0, w, h);
    const b64 = canvas.toDataURL('image/jpeg', 0.7).split(',')[1];
    const prompt = `使用者問：「${question}」。請根據圖片回答：有或沒有？如果有，在什麼位置（左/前/右）？距離遠近？只用繁體中文簡短回答。`;
    try {
      const res = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST', headers: { 'Content-Type': 'application/json', 'x-api-key': S.apiKey, 'anthropic-version': '2023-06-01' },
        body: JSON.stringify({ model: 'claude-3-haiku-20240307', max_tokens: 150, messages: [{ role: 'user', content: [{ type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: b64 } }, { type: 'text', text: prompt }] }] })
      });
      const data = await res.json();
      const answer = data.content?.[0]?.text || '無法回答';
      say(answer, true);
    } catch (err) { say('詢問失敗', true); }
  };
  askRec.start();
}

// 導航、家人、語音指令等功能 (簡化保留)
function setHome() {
  if (!navigator.geolocation) { say('無GPS', true); return; }
  say('記錄家中位置...', true);
  navigator.geolocation.getCurrentPosition(p => { S.homePos = { lat: p.coords.latitude, lng: p.coords.longitude }; localStorage.setItem('homePos', JSON.stringify(S.homePos)); say(`家已記錄`, true); }, () => say('定位失敗', true), { enableHighAccuracy: true });
}
function toggleNav() { S.navigating ? stopNav() : startNav(); }
function startNav() {
  if (!S.homePos) { say('請先設定家的位置', true); return; }
  S.navigating = true;
  document.getElementById('navBtn').className = 'act-btn btn-stop';
  document.getElementById('navLbl').textContent = '停止導航';
  say('開始導航回家', true);
  S.watchId = navigator.geolocation.watchPosition(p => updateNav(p), null, { enableHighAccuracy: true });
}
function stopNav() {
  if (S.watchId) { navigator.geolocation.clearWatch(S.watchId); S.watchId = null; }
  S.navigating = false;
  if (document.getElementById('navBtn')) { document.getElementById('navBtn').className = 'act-btn btn-nav'; document.getElementById('navLbl').textContent = '導航回家'; }
}
function updateNav(p) {
  const cur = { lat: p.coords.latitude, lng: p.coords.longitude }, h = S.homePos;
  const R = 6371000;
  const dLat = (h.lat - cur.lat) * Math.PI / 180, dLon = (h.lng - cur.lng) * Math.PI / 180;
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(cur.lat * Math.PI / 180) * Math.cos(h.lat * Math.PI / 180) * Math.sin(dLon / 2) ** 2;
  const dist = Math.round(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
  const y = Math.sin(dLon) * Math.cos(h.lat * Math.PI / 180);
  const x = Math.cos(cur.lat * Math.PI / 180) * Math.sin(h.lat * Math.PI / 180) - Math.sin(cur.lat * Math.PI / 180) * Math.cos(h.lat * Math.PI / 180) * Math.cos(dLon);
  const bear = ((Math.atan2(y, x) * 180 / Math.PI) + 360) % 360;
  const dirs = ['北', '東北', '東', '東南', '南', '西南', '西', '西北'];
  const dir = dirs[Math.round(bear / 45) % 8];
  if (dist < 8) { say('已抵達目的地', true); stopNav(); } else { say(dist < 50 ? `快到了，剩${dist}公尺，朝${dir}` : `距離家${dist}公尺，朝${dir}`, true); }
}
const CMD = { '開始': () => startRunning(), '停止': () => stopRunning(), '回家': () => startNav(), '導航': () => startNav(), '停止導航': () => stopNav(), '設定家': () => setHome(), '緊急': () => sos() };
function toggleVoice() { S.voiceOn ? stopVoiceRec() : startVoiceRec(); }
function startVoiceRec() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { say('不支援語音指令', true); return; }
  if (!S.voiceRec) {
    S.voiceRec = new SR();
    S.voiceRec.continuous = true;
    S.voiceRec.lang = 'zh-TW';
    S.voiceRec.onresult = e => { const t = e.results[e.results.length - 1][0].transcript; for (let [k, fn] of Object.entries(CMD)) if (t.includes(k)) { fn(); return; } };
    S.voiceRec.onend = () => { if (S.voiceOn) setTimeout(() => { try { S.voiceRec.start(); } catch (e) { } }, 400); };
  }
  try { S.voiceRec.start(); } catch (e) { }
  S.voiceOn = true;
  document.getElementById('micBtn').className = 'bb-btn bb-mic on';
  say('語音控制開啟，說「開始」「停止」「回家」「設定家」「緊急」', true);
}
function stopVoiceRec() { if (S.voiceRec) try { S.voiceRec.stop(); } catch (e) { } S.voiceOn = false; document.getElementById('micBtn').className = 'bb-btn bb-mic'; }
function renderFam() {
  const g = document.getElementById('famGrid');
  g.innerHTML = S.family.map(m => `<div class="fam-card" onclick="say('這是${m.name}，${m.rel}', true)"><div class="fam-photo">${m.photo ? `<img src="${m.photo}">` : '👤'}</div><div class="fam-name">${m.name}</div><div class="fam-rel">${m.rel}</div></div>`).join('') + `<div class="fam-card add-card" onclick="openModal()"><div class="fam-photo">＋</div><div class="fam-name">新增</div></div>`;
}
function openModal() { S.tempPhoto = null; document.getElementById('famName').value = ''; document.getElementById('famRel').value = ''; document.getElementById('phPrev').innerHTML = '📷'; document.getElementById('famModal').className = 'open'; }
function closeModal() { document.getElementById('famModal').className = ''; }
function handlePhoto(e) { const f = e.target.files[0]; if (!f) return; const reader = new FileReader(); reader.onload = ev => { S.tempPhoto = ev.target.result; document.getElementById('phPrev').innerHTML = `<img src="${ev.target.result}">`; }; reader.readAsDataURL(f); }
function saveFam() { const name = document.getElementById('famName').value.trim(); if (!name) { alert('請輸入稱呼'); return; } S.family.push({ id: Date.now(), name, rel: document.getElementById('famRel').value.trim() || '家人', photo: S.tempPhoto }); localStorage.setItem('family', JSON.stringify(S.family)); renderFam(); closeModal(); say(`${name}已加入`, true); }
function sos() { say('緊急呼叫中', true); setTimeout(() => { window.location.href = 'tel:112'; }, 500); }
</script>
