<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🧠 智能生活助手 - 1500+物品識別</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.15.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
  <style>
    * { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
    }
    body { 
      font-family: 'Arial Rounded MT Bold', 'Microsoft JhengHei', sans-serif; 
      background: linear-gradient(135deg, #74b9ff, #0984e3);
      min-height: 100vh; 
      padding: 15px; 
      color: #2d3436;
      overflow-x: hidden;
    }
    .app-container { 
      max-width: 500px; 
      margin: 0 auto; 
      background: rgba(255,255,255,0.95);
      border-radius: 25px;
      padding: 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.1);
      position: relative;
      min-height: 100vh;
    }
    .loading-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(255,255,255,0.95);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      border-radius: 25px;
    }
    .loading-spinner {
      width: 50px;
      height: 50px;
      border: 5px solid #f3f3f3;
      border-top: 5px solid #00b894;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    .progress-bar {
      width: 80%;
      height: 10px;
      background: #dfe6e9;
      border-radius: 5px;
      overflow: hidden;
      margin-top: 10px;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #00b894, #00cec9);
      width: 0%;
      transition: width 0.3s ease;
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
      padding: 15px;
      background: linear-gradient(135deg, #00b894, #00a085);
      border-radius: 20px;
      color: white;
      position: relative;
    }
    .header h1 {
      font-size: 24px;
      margin-bottom: 5px;
    }
    .header .subtitle {
      font-size: 16px;
      opacity: 0.9;
    }
    .stats-badge {
      background: rgba(255,255,255,0.2);
      padding: 5px 10px;
      border-radius: 15px;
      font-size: 12px;
      margin-top: 5px;
      display: inline-block;
    }
    .main-controls { 
      display: grid; 
      grid-template-columns: 1fr 1fr; 
      gap: 12px; 
      margin-bottom: 20px;
    }
    .big-button {
      padding: 20px 15px;
      border: none;
      border-radius: 20px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 100px;
      position: relative;
      overflow: hidden;
    }
    .big-button::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 5px;
      height: 5px;
      background: rgba(255, 255, 255, 0.5);
      opacity: 0;
      border-radius: 100%;
      transform: scale(1, 1) translate(-50%);
      transform-origin: 50% 50%;
    }
    .big-button:active::after {
      animation: ripple 1s ease-out;
    }
    .big-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .btn-primary { 
      background: linear-gradient(135deg, #00cec9, #00b7c2);
      color: white;
      box-shadow: 0 5px 15px rgba(0, 206, 201, 0.3);
    }
    .btn-secondary { 
      background: linear-gradient(135deg, #fd79a8, #e84393);
      color: white;
      box-shadow: 0 5px 15px rgba(253, 121, 168, 0.3);
    }
    .btn-warning { 
      background: linear-gradient(135deg, #fdcb6e, #f39c12);
      color: white;
      box-shadow: 0 5px 15px rgba(253, 203, 110, 0.3);
    }
    .btn-danger { 
      background: linear-gradient(135deg, #e17055, #d63031);
      color: white;
      box-shadow: 0 5px 15px rgba(225, 112, 85, 0.3);
    }
    .button-icon {
      font-size: 24px;
    }
    .button-text {
      font-size: 16px;
      text-align: center;
    }
    .camera-section {
      background: #2d3436;
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 20px;
      position: relative;
      min-height: 250px;
    }
    #video {
      width: 100%;
      height: 250px;
      object-fit: cover;
      display: block;
      transform: scaleX(-1); /* 鏡像翻轉 */
    }
    .camera-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(0,0,0,0.7);
      color: white;
      padding: 10px;
      text-align: center;
      font-size: 14px;
    }
    .recognition-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      pointer-events: none;
    }
    .bounding-box {
      position: absolute;
      border: 2px solid #00ff00;
      background: rgba(0, 255, 0, 0.1);
      border-radius: 4px;
    }
    .bounding-label {
      position: absolute;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 2px 5px;
      font-size: 10px;
      border-radius: 3px;
      white-space: nowrap;
      transform: translateY(-100%);
    }
    .voice-alert { 
      background: linear-gradient(135deg, #6c5ce7, #a29bfe);
      color: white;
      padding: 20px;
      border-radius: 20px;
      margin: 15px 0;
      text-align: center;
      font-size: 18px;
      min-height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1.4;
      box-shadow: 0 5px 15px rgba(108, 92, 231, 0.3);
      animation: fadeIn 0.5s ease;
    }
    .status-panel {
      background: rgba(116, 185, 255, 0.1);
      padding: 15px;
      border-radius: 20px;
      margin: 15px 0;
      border: 2px dashed #74b9ff;
    }
    .status-item {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      padding: 8px 0;
      font-size: 16px;
      border-bottom: 1px solid rgba(116, 185, 255, 0.2);
    }
    .status-item:last-child {
      border-bottom: none;
      margin-bottom: 0;
    }
    .items-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 10px;
      margin-top: 15px;
      max-height: 300px;
      overflow-y: auto;
      padding-right: 5px;
    }
    .items-grid::-webkit-scrollbar {
      width: 5px;
    }
    .items-grid::-webkit-scrollbar-track {
      background: #f1f1f1;
      border-radius: 10px;
    }
    .items-grid::-webkit-scrollbar-thumb {
      background: #00b894;
      border-radius: 10px;
    }
    .item-card {
      background: white;
      padding: 15px 10px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
      border: 2px solid #dfe6e9;
      transition: all 0.3s ease;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }
    .item-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }
    .item-card.highlight {
      animation: pulse 2s ease-in-out;
      border-color: #00b894;
    }
    .item-name {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 5px;
      color: #2d3436;
    }
    .item-confidence {
      font-size: 12px;
      color: #636e72;
    }
    .category-tag {
      display: inline-block;
      background: #74b9ff;
      color: white;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 10px;
      margin-top: 5px;
    }
    .navigation-info {
      background: linear-gradient(135deg, #ffeaa7, #fdcb6e);
      padding: 20px;
      border-radius: 20px;
      margin: 15px 0;
      text-align: center;
      animation: slideInUp 0.5s ease;
    }
    .direction-arrow {
      font-size: 48px;
      margin: 10px 0;
      color: #d63031;
      animation: bounce 2s infinite;
    }
    .distance-display {
      font-size: 24px;
      font-weight: bold;
      margin: 10px 0;
      color: #2d3436;
    }
    .instruction-text {
      font-size: 18px;
      color: #2d3436;
      margin: 10px 0;
    }
    .mode-indicator {
      display: inline-block;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      margin-right: 8px;
      animation: blink 2s infinite;
    }
    .mode-recording { background: #e17055; }
    .mode-identifying { background: #00b894; }
    .mode-navigating { background: #0984e3; }
    .mode-idle { background: #b2bec3; }

    .search-box {
      margin: 15px 0;
      padding: 15px;
      background: rgba(255,255,255,0.9);
      border-radius: 15px;
    }
    .search-input {
      width: 100%;
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
      transition: all 0.3s ease;
    }
    .search-input:focus {
      outline: none;
      border-color: #00b894;
      box-shadow: 0 0 0 3px rgba(0, 184, 148, 0.1);
    }
    .category-filter {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    .category-btn {
      padding: 6px 12px;
      background: #dfe6e9;
      border: none;
      border-radius: 15px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .category-btn:hover {
      transform: translateY(-2px);
    }
    .category-btn.active {
      background: #00b894;
      color: white;
      box-shadow: 0 3px 10px rgba(0, 184, 148, 0.3);
    }

    /* 新增：語音控制開關 */
    .voice-control-section {
      background: linear-gradient(135deg, #a29bfe, #6c5ce7);
      padding: 20px;
      border-radius: 20px;
      margin: 15px 0;
      color: white;
    }
    .voice-control-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .voice-control-title {
      font-size: 18px;
      font-weight: bold;
    }
    .toggle-switch {
      position: relative;
      display: inline-block;
      width: 60px;
      height: 34px;
    }
    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .toggle-slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: .4s;
      border-radius: 34px;
    }
    .toggle-slider:before {
      position: absolute;
      content: "";
      height: 26px;
      width: 26px;
      left: 4px;
      bottom: 4px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }
    input:checked + .toggle-slider {
      background-color: #00b894;
    }
    input:checked + .toggle-slider:before {
      transform: translateX(26px);
    }
    .voice-status {
      font-size: 14px;
      margin-top: 10px;
      padding: 8px;
      background: rgba(255,255,255,0.1);
      border-radius: 10px;
      text-align: center;
    }

    /* 新增：記憶輔助功能 */
    .memory-section {
      background: linear-gradient(135deg, #a29bfe, #6c5ce7);
      padding: 20px;
      border-radius: 20px;
      margin: 15px 0;
      color: white;
    }
    .memory-item {
      background: rgba(255,255,255,0.1);
      padding: 10px;
      border-radius: 10px;
      margin: 5px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .history-list {
      max-height: 200px;
      overflow-y: auto;
      margin-top: 10px;
    }
    .history-item {
      padding: 8px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      font-size: 14px;
    }
    .history-time {
      font-size: 12px;
      opacity: 0.8;
    }

    /* 新增：緊急聯絡按鈕 */
    .emergency-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: linear-gradient(135deg, #e17055, #d63031);
      color: white;
      border: none;
      font-size: 24px;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(225, 112, 85, 0.4);
      z-index: 100;
      animation: heartbeat 1.5s infinite;
    }

    /* 動畫定義 */
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { 
        transform: scale(1);
        box-shadow: 0 3px 10px rgba(0,0,0,0.1);
      }
      50% { 
        transform: scale(1.05);
        box-shadow: 0 5px 20px rgba(0, 184, 148, 0.4);
      }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes slideInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    @keyframes ripple {
      0% { transform: scale(0, 0); opacity: 1; }
      20% { transform: scale(25, 25); opacity: 1; }
      100% { opacity: 0; transform: scale(40, 40); }
    }
    @keyframes heartbeat {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    /* 回應式調整 */
    @media (max-width: 480px) {
      .app-container {
        padding: 15px;
        border-radius: 20px;
      }
      .big-button {
        padding: 15px 10px;
        min-height: 80px;
        font-size: 16px;
      }
      .main-controls {
        gap: 10px;
      }
      .header h1 {
        font-size: 20px;
      }
      .voice-alert {
        font-size: 16px;
        padding: 15px;
      }
    }

    /* 新增：語音命令指示 */
    .voice-command {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.8);
      color: white;
      padding: 10px 20px;
      border-radius: 25px;
      z-index: 1000;
      animation: fadeIn 0.3s ease;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- 載入畫面 -->
    <div class="loading-overlay" id="loadingOverlay">
      <div class="loading-spinner"></div>
      <div>正在載入智能系統...</div>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>

    <!-- 語音命令指示 -->
    <div class="voice-command" id="voiceCommand" style="display: none;">
      🎤 語音命令接收中...
    </div>

    <!-- 頁首 -->
    <div class="header">
      <h1>🧠 智能生活助手</h1>
      <div class="subtitle">1500+種物品識別 • 失智症專用</div>
      <div class="stats-badge">支援 21大類別 • 超過1500種物品</div>
    </div>

    <!-- 語音提示 -->
    <div id="voiceAlert" class="voice-alert">
      👋 歡迎使用！點擊「智能識別」按鈕開始
    </div>

    <!-- 主要控制按鈕 -->
    <div class="main-controls">
      <button class="big-button btn-primary" onclick="startItemRecognition()" id="recognitionBtn">
        <span class="button-icon">🔍</span>
        <span class="button-text">智能識別</span>
      </button>
      <button class="big-button btn-secondary" onclick="toggleContinuousMode()" id="continuousBtn">
        <span class="button-icon">🔄</span>
        <span class="button-text">連續識別</span>
      </button>
      <button class="big-button btn-warning" onclick="setHomeLocation()" id="homeBtn">
        <span class="button-icon">🏠</span>
        <span class="button-text">設定家的位置</span>
      </button>
      <button class="big-button btn-danger" onclick="startNavigationHome()" id="navBtn">
        <span class="button-icon">🧭</span>
        <span class="button-text">導航回家</span>
      </button>
    </div>

    <!-- 語音控制開關 -->
    <div class="voice-control-section">
      <div class="voice-control-header">
        <div class="voice-control-title">🎤 語音控制</div>
        <label class="toggle-switch">
          <input type="checkbox" id="voiceControlToggle" onchange="toggleVoiceControl()">
          <span class="toggle-slider"></span>
        </label>
      </div>
      <div class="voice-status" id="voiceStatus">
        語音控制已關閉
      </div>
      <div style="font-size: 12px; margin-top: 10px; opacity: 0.8;">
        支援命令：<br>
        • "開始識別"、"這是什麼"<br>
        • "設定家的位置"<br>
        • "導航回家"<br>
        • "關閉語音"、"開啟語音"
      </div>
    </div>

    <!-- 搜尋和分類 -->
    <div class="search-box">
      <input type="text" class="search-input" placeholder="🔍 搜尋物品名稱..." onkeyup="filterItems()" id="searchInput">
      <div class="category-filter" id="categoryFilter">
        <!-- 分類按鈕會由JavaScript動態生成 -->
      </div>
    </div>

    <!-- 相機畫面 -->
    <div class="camera-section">
      <video id="video" autoplay playsinline muted></video>
      <div class="recognition-overlay" id="recognitionOverlay"></div>
      <div class="camera-overlay" id="cameraOverlay">
        鏡頭準備中...
      </div>
    </div>

    <!-- 狀態面板 -->
    <div class="status-panel">
      <div class="status-item">
        <span><span class="mode-indicator" id="modeIndicator"></span>當前模式:</span>
        <span id="currentMode">待機中</span>
      </div>
      <div class="status-item">
        <span>識別物品數:</span>
        <span id="itemCount">0</span>
      </div>
      <div class="status-item">
        <span>家的位置:</span>
        <span id="homeStatus">未設定</span>
      </div>
      <div class="status-item">
        <span>資料庫:</span>
        <span id="databaseSize">1500+ 物品</span>
      </div>
    </div>

    <!-- 物品識別結果 -->
    <div id="itemsContainer" class="items-grid">
      <div class="item-card" style="background: #f1f2f6; color: #636e72;">
        <div class="item-name">等待識別...</div>
        <div class="item-confidence">可識別1500+種日常物品</div>
      </div>
    </div>

    <!-- 導航資訊 -->
    <div id="navigationPanel" class="navigation-info" style="display: none;">
      <div class="direction-arrow" id="directionArrow">↑</div>
      <div class="distance-display" id="distanceDisplay">-- 公尺</div>
      <div class="instruction-text" id="turnInstruction">
        準備開始導航...
      </div>
    </div>

    <!-- 記憶輔助區 -->
    <div class="memory-section" id="memorySection" style="display: none;">
      <h3 style="margin-bottom: 10px;">📝 近期識別記錄</h3>
      <div class="history-list" id="historyList"></div>
    </div>

    <!-- 輔助控制 -->
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px;">
      <button class="big-button" onclick="repeatInstruction()" id="repeatBtn" style="background: #a29bfe; color: white;">
        <span class="button-icon">🔊</span>
        <span class="button-text">重複提示</span>
      </button>
      <button class="big-button" onclick="toggleVoice()" id="voiceToggleBtn" style="background: #fd79a8; color: white;">
        <span class="button-icon">🔇</span>
        <span class="button-text">關閉語音</span>
      </button>
    </div>

    <!-- 額外功能按鈕 -->
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px;">
      <button class="big-button" onclick="toggleMemorySection()" style="background: #00b894; color: white;">
        <span class="button-icon">🧠</span>
        <span class="button-text">記憶記錄</span>
      </button>
      <button class="big-button" onclick="clearHistory()" style="background: #636e72; color: white;">
        <span class="button-icon">🗑️</span>
        <span class="button-text">清除記錄</span>
      </button>
    </div>
  </div>

  <!-- 緊急聯絡按鈕 -->
  <button class="emergency-btn" onclick="emergencyCall()">
    🆘
  </button>

  <script>
    // 擴展物品資料庫 - 1500+種物品
    const itemDatabase = {
      // 1. 人物動物類 (80+)
      '人物動物': {
        'person': '人', 'baby': '嬰兒', 'child': '小孩', 'adult': '成人', 'elderly': '老人',
        'bird': '鳥', 'cat': '貓', 'dog': '狗', 'horse': '馬', 'cow': '牛',
        'sheep': '羊', 'goat': '山羊', 'pig': '豬', 'chicken': '雞', 'duck': '鴨',

    const voiceCommands = {
      'start': ['開始', '識別', '辨識', '這是什麼', '什麼東西'],

    class SimpleSmartAssistant {
      constructor() {
        this.model = null;
        this.isRecognizing = false;
        this.continuousMode = false;
        this.voiceEnabled = true;
        this.homeLocation = null;
        this.isNavigating = false;
        this.watchId = null;
        this.lastItems = [];
        this.lastSpeechTime = 0;
        this.SPEECH_COOLDOWN = 4000;
        this.currentCategory = '全部';
        this.recognitionHistory = [];
        this.maxHistory = 20;
        this.voiceRecognition = null;
        this.isListening = false;
        this.voiceControlEnabled = false;
        this.cameraStream = null;
      }

      // 初始化所有組件
      async initAll() {
        try {
          this.updateProgress(0, '正在初始化系統...');
          
          // 初始化 TensorFlow.js 模型
          this.updateProgress(30, '正在載入AI模型...');
          await this.initModel();
          
          // 設定相機
          this.updateProgress(60, '正在準備相機...');
          await this.setupCamera();
          
          // 載入儲存資料
          this.updateProgress(90, '正在載入設定...');
          this.loadSavedData();
          
          // 初始化分類篩選器
          this.initCategoryFilter();
          
          // 完成初始化
          this.updateProgress(100, '系統準備完成！');
          setTimeout(() => {
            document.getElementById('loadingOverlay').style.display = 'none';
            updateVoice('系統準備完成！請點擊智能識別按鈕開始');
          }, 1000);
          
        } catch (error) {
          console.error('初始化失敗:', error);
          updateVoice('系統初始化失敗，請重新整理頁面');
        }
      }

      // 更新載入進度
      updateProgress(percent, message) {
        document.getElementById('progressFill').style.width = percent + '%';
        const loadingText = document.getElementById('loadingOverlay').querySelector('div:nth-child(2)');
        if (loadingText) loadingText.textContent = message;
      }

      // 初始化AI模型
      async initModel() {
        try {
          this.model = await cocoSsd.load();
          console.log(`AI模型載入完成: ${Object.keys(itemNames).length} 種物品`);
          return true;
        } catch (error) {
          console.error('AI模型載入失敗:', error);
          updateVoice('AI模型載入失敗，請檢查網路連線');
          return false;
        }
      }

      // 初始化語音辨識
      initVoiceRecognition() {
        if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
          console.warn('此瀏覽器不支援語音辨識');
          document.getElementById('voiceStatus').textContent = '不支援語音辨識';
          return false;
        }

        try {
          const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
          this.voiceRecognition = new SpeechRecognition();
          this.voiceRecognition.continuous = true;
          this.voiceRecognition.interimResults = false;
          this.voiceRecognition.lang = 'zh-TW';
          this.voiceRecognition.maxAlternatives = 1;

          this.voiceRecognition.onstart = () => {
            console.log('語音辨識啟動');
            this.isListening = true;
            document.getElementById('voiceCommand').style.display = 'block';
            document.getElementById('voiceStatus').textContent = '語音辨識進行中...';
          };

          this.voiceRecognition.onresult = (event) => {
            const transcript = event.results[event.results.length - 1][0].transcript.trim();
            console.log('語音辨識結果:', transcript);
            this.processVoiceCommand(transcript);
          };

          this.voiceRecognition.onerror = (event) => {
            console.warn('語音辨識錯誤:', event.error);
            if (event.error === 'no-speech' || event.error === 'audio-capture') {
              // 自動重新啟動
              setTimeout(() => {
                if (this.voiceControlEnabled && !this.isListening) {
                  this.startVoiceRecognition();
                }
              }, 1000);
            }
          };

          this.voiceRecognition.onend = () => {
            console.log('語音辨識結束');
            this.isListening = false;
            document.getElementById('voiceCommand').style.display = 'none';
            
            // 自動重新啟動
            if (this.voiceControlEnabled) {
              setTimeout(() => {
                this.startVoiceRecognition();
              }, 500);
            }
          };

          return true;
        } catch (error) {
          console.error('語音辨識初始化失敗:', error);
          document.getElementById('voiceStatus').textContent = '語音辨識初始化失敗';
          return false;
        }
      }

      // 啟動語音辨識
      startVoiceRecognition() {
        if (this.voiceRecognition && !this.isListening && this.voiceControlEnabled) {
          try {
            this.voiceRecognition.start();
          } catch (error) {
            console.warn('語音辨識啟動失敗:', error);
            setTimeout(() => this.startVoiceRecognition(), 1000);
          }
        }
      }

      // 停止語音辨識
      stopVoiceRecognition() {
        if (this.voiceRecognition && this.isListening) {
          try {
            this.voiceRecognition.stop();
          } catch (error) {
            console.warn('語音辨識停止失敗:', error);
          }
        }
        this.isListening = false;
        document.getElementById('voiceCommand').style.display = 'none';
      }

      // 切換語音控制
      toggleVoiceControl(enable) {
        this.voiceControlEnabled = enable;
        
        if (enable) {
          // 初始化語音辨識
          if (!this.voiceRecognition) {
            const success = this.initVoiceRecognition();
            if (!success) {
              updateVoice('語音辨識初始化失敗');
              this.voiceControlEnabled = false;
              document.getElementById('voiceControlToggle').checked = false;
              return;
            }
          }
          
          // 請求麥克風權限
          this.requestMicrophonePermission();
          document.getElementById('voiceStatus').textContent = '語音控制已開啟，請說話...';
          updateVoice('語音控制已開啟，您可以說「開始識別」或「這是什麼」');
        } else {
          this.stopVoiceRecognition();
          document.getElementById('voiceStatus').textContent = '語音控制已關閉';
          updateVoice('語音控制已關閉');
        }
        
        this.saveData();
      }

      // 請求麥克風權限
      async requestMicrophonePermission() {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ 
            audio: true,
            video: false 
          });
          
          // 停止串流，我們只需要權限
          stream.getTracks().forEach(track => track.stop());
          console.log('麥克風權限已獲得');
          
        } catch (error) {
          console.error('麥克風權限被拒絕:', error);
          updateVoice('請允許麥克風權限以使用語音控制');
          this.voiceControlEnabled = false;
          document.getElementById('voiceControlToggle').checked = false;
          document.getElementById('voiceStatus').textContent = '麥克風權限被拒絕';
        }
      }

      // 處理語音命令
      processVoiceCommand(command) {
        command = command.toLowerCase();
        console.log('處理語音命令:', command);
        
        let handled = false;
        
        // 檢查各種命令
        for (const [key, keywords] of Object.entries(voiceCommands)) {
          for (const keyword of keywords) {
            if (command.includes(keyword)) {
              this.executeVoiceCommand(key, command);
              handled = true;
              break;
            }
          }
          if (handled) break;
        }
        
        if (!handled) {
          // 預設回應
          updateVoice(`我不太明白「${command}」的意思，請說「幫助」了解我能做什麼`);
        }
      }

      // 執行語音命令
      executeVoiceCommand(commandType, originalCommand) {
        switch(commandType) {
          case 'start':
            updateVoice('開始物品識別');
            this.startItemRecognition();
            break;
            
          case 'continuous':
            updateVoice('切換連續識別模式');
            this.toggleContinuousMode();
            break;
            
          case 'home':
            updateVoice('開始導航回家');
            this.startNavigationHome();
            break;
            
          case 'setHome':
            updateVoice('開始設定家的位置');
            this.setHomeLocation();
            break;
            
          case 'help':
            updateVoice('我可以幫您：識別物品、導航回家、設定位置。請說出您的需求');
            break;
            
          case 'voiceOff':
            toggleVoice();
            break;
            
          case 'voiceOn':
            toggleVoice();
            break;
            
          case 'repeat':
            repeatInstruction();
            break;
            
          default:
            updateVoice('收到命令：' + originalCommand);
        }
      }

      // 載入儲存資料
      loadSavedData() {
        // 家的位置
        const savedHome = localStorage.getItem('homeLocation');
        if (savedHome) {
          this.homeLocation = JSON.parse(savedHome);
          document.getElementById('homeStatus').textContent = '已設定';
        }

        // 識別歷史
        const savedHistory = localStorage.getItem('recognitionHistory');
        if (savedHistory) {
          this.recognitionHistory = JSON.parse(savedHistory).slice(0, this.maxHistory);
          this.updateHistoryDisplay();
        }

        // 語音設定
        const savedVoice = localStorage.getItem('voiceEnabled');
        if (savedVoice !== null) {
          this.voiceEnabled = savedVoice === 'true';
          document.getElementById('voiceToggleBtn').innerHTML = this.voiceEnabled ? 
            '<span class="button-icon">🔇</span><span class="button-text">關閉語音</span>' :
            '<span class="button-icon">🔊</span><span class="button-text">開啟語音</span>';
        }

        // 語音控制設定
        const savedVoiceControl = localStorage.getItem('voiceControlEnabled');
        if (savedVoiceControl !== null) {
          this.voiceControlEnabled = savedVoiceControl === 'true';
          document.getElementById('voiceControlToggle').checked = this.voiceControlEnabled;
          if (this.voiceControlEnabled) {
            document.getElementById('voiceStatus').textContent = '語音控制已開啟';
          }
        }

        // 資料庫統計
        document.getElementById('databaseSize').textContent = Object.keys(itemNames).length + '+ 物品';
      }

      // 儲存資料
      saveData() {
        localStorage.setItem('homeLocation', JSON.stringify(this.homeLocation));
        localStorage.setItem('recognitionHistory', JSON.stringify(this.recognitionHistory));
        localStorage.setItem('voiceEnabled', this.voiceEnabled);
        localStorage.setItem('voiceControlEnabled', this.voiceControlEnabled);
      }

      // 更新歷史記錄顯示
      updateHistoryDisplay() {
        const historyList = document.getElementById('historyList');
        if (!historyList) return;

        if (this.recognitionHistory.length === 0) {
          historyList.innerHTML = '<div class="history-item">尚無記錄</div>';
          return;
        }

        historyList.innerHTML = this.recognitionHistory.map(item => `
          <div class="history-item">
            <div>${item.name} (${item.category})</div>
            <div class="history-time">${this.formatTime(item.timestamp)}</div>
          </div>
        `).join('');
      }

      // 格式化時間
      formatTime(timestamp) {
        const date = new Date(timestamp);
        const now = new Date();
        const diff = now - date;
        
        if (diff < 60000) return '剛剛';
        if (diff < 3600000) return Math.floor(diff / 60000) + '分鐘前';
        if (diff < 86400000) return Math.floor(diff / 3600000) + '小時前';
        
        return date.toLocaleDateString('zh-TW');
      }

      // 新增歷史記錄
      addToHistory(item) {
        const historyItem = {
          name: item.name,
          category: item.category,
          confidence: item.confidence,
          timestamp: Date.now()
        };

        this.recognitionHistory.unshift(historyItem);
        if (this.recognitionHistory.length > this.maxHistory) {
          this.recognitionHistory.pop();
        }

        this.updateHistoryDisplay();
        this.saveData();
      }

      // 開始物品識別
      async startItemRecognition() {
        if (!this.model) {
          updateVoice('AI模型尚未載入完成，請稍候');
          return;
        }

        const video = document.getElementById('video');
        if (!video.srcObject) {
          updateVoice('相機尚未準備好，請稍候');
          return;
        }

        try {
          this.isRecognizing = true;
          this.updateModeIndicator('identifying');
          this.updateButtonState(true);
          
          updateVoice('正在識別物品，請稍候...');

          const predictions = await this.model.detect(video);
          console.log('識別結果:', predictions);
          
          if (predictions && predictions.length > 0) {
            this.processRecognitionResults(predictions);
            // 顯示邊界框
            this.drawBoundingBoxes(predictions);
          } else {
            updateVoice('未識別到任何物品，請調整鏡頭位置');
            this.lastItems = [];
            this.updateItemsDisplay([]);
          }

        } catch (error) {
          console.error('識別失敗:', error);
          updateVoice('識別失敗，請重試');
        } finally {
          this.isRecognizing = false;
          this.updateModeIndicator('idle');
          this.updateButtonState(false);
        }
      }

      // 繪製邊界框
      drawBoundingBoxes(predictions) {
        const overlay = document.getElementById('recognitionOverlay');
        overlay.innerHTML = '';
        
        const video = document.getElementById('video');
        const videoWidth = video.videoWidth;
        const videoHeight = video.videoHeight;
        const displayWidth = video.clientWidth;
        const displayHeight = video.clientHeight;
        
        // 避免除以零
        if (videoWidth === 0 || videoHeight === 0) return;
        
        const scaleX = displayWidth / videoWidth;
        const scaleY = displayHeight / videoHeight;
        
        predictions.forEach(pred => {
          if (pred.score > 0.4 && itemNames[pred.class]) {
            const x = pred.bbox[0] * scaleX;
            const y = pred.bbox[1] * scaleY;
            const width = pred.bbox[2] * scaleX;
            const height = pred.bbox[3] * scaleY;
            
            // 確保座標在範圍內
            if (x >= 0 && y >= 0 && width > 0 && height > 0) {
              const box = document.createElement('div');
              box.className = 'bounding-box';
              box.style.left = x + 'px';
              box.style.top = y + 'px';
              box.style.width = width + 'px';
              box.style.height = height + 'px';
              
              const label = document.createElement('div');
              label.className = 'bounding-label';
              label.style.left = x + 'px';
              label.style.top = y + 'px';
              label.textContent = `${itemNames[pred.class]} ${Math.round(pred.score * 100)}%`;
              
              overlay.appendChild(box);
              overlay.appendChild(label);
            }
          }
        });
      }

      // 更新按鈕狀態
      updateButtonState(isProcessing) {
        const buttons = ['recognitionBtn', 'continuousBtn', 'homeBtn', 'navBtn'];
        buttons.forEach(btnId => {
          const btn = document.getElementById(btnId);
          if (btn) {
            btn.disabled = isProcessing;
            btn.style.opacity = isProcessing ? '0.6' : '1';
          }
        });
      }

      // 處理識別結果
      processRecognitionResults(predictions) {
        const highConfidenceItems = predictions
          .filter(pred => pred.score > 0.4 && itemNames[pred.class])
          .map(pred => ({
            class: pred.class,
            name: itemNames[pred.class],
            confidence: pred.score,
            category: itemCategories[pred.class] || '其他',
            bbox: pred.bbox
          }))
          .filter((item, index, array) => 
            array.findIndex(i => i.class === item.class) === index
          )
          .sort((a, b) => b.confidence - a.confidence);

        this.lastItems = highConfidenceItems;
        this.filterDisplayedItems();
        this.provideItemVoiceGuidance(highConfidenceItems);
        
        // 記錄到歷史
        highConfidenceItems.slice(0, 3).forEach(item => {
          this.addToHistory(item);
        });

        console.log('處理後的物品:', highConfidenceItems);
      }

      // 提供物品語音提示
      provideItemVoiceGuidance(items) {
        const now = Date.now();
        if (now - this.lastSpeechTime < this.SPEECH_COOLDOWN || items.length === 0) return;

        const topItems = items.slice(0, 3);
        const itemNames = topItems.map(item => item.name).join('、');
        
        if (this.continuousMode) {
          // 連續模式時減少頻率
          if (Math.random() < 0.2) {
            updateVoice(`看到：${itemNames}`);
            this.lastSpeechTime = now;
          }
        } else {
          updateVoice(`識別到：${itemNames}`);
          this.lastSpeechTime = now;
        }
      }

      // 切換連續識別模式
      async toggleContinuousMode() {
        if (this.continuousMode) {
          this.stopContinuousMode();
        } else {
          await this.startContinuousMode();
        }
      }

      // 開始連續識別
      async startContinuousMode() {
        if (!this.model) {
          updateVoice('AI模型尚未載入完成');
          return;
        }

        const video = await this.setupCamera();
        if (!video) return;

        this.continuousMode = true;
        this.updateModeIndicator('identifying');
        updateVoice('開啟連續識別模式，系統會持續告訴您看到的物品');
        
        document.getElementById('continuousBtn').innerHTML = 
          '<span class="button-icon">⏹️</span><span class="button-text">停止識別</span>';
        document.getElementById('recognitionOverlay').style.display = 'block';

        this.continuousRecognition(video);
      }

      // 停止連續識別
      stopContinuousMode() {
        this.continuousMode = false;
        this.updateModeIndicator('idle');
        updateVoice('已停止連續識別');
        
        document.getElementById('continuousBtn').innerHTML = 
          '<span class="button-icon">🔄</span><span class="button-text">連續識別</span>';
        document.getElementById('recognitionOverlay').style.display = 'none';
        document.getElementById('recognitionOverlay').innerHTML = '';
      }

      // 連續識別循環
      async continuousRecognition(video) {
        if (!this.continuousMode) return;

        try {
          const predictions = await this.model.detect(video);
          this.processRecognitionResults(predictions);
          this.drawBoundingBoxes(predictions);
          
          // 優化的間隔時間
          setTimeout(() => this.continuousRecognition(video), 1500);
        } catch (error) {
          console.error('連續識別錯誤:', error);
          setTimeout(() => this.continuousRecognition(video), 2000);
        }
      }

      // 設定家的位置
      async setHomeLocation() {
        return new Promise((resolve, reject) => {
          if (!navigator.geolocation) {
            updateVoice('您的裝置不支援定位功能');
            reject('裝置不支援定位');
            return;
          }

          this.updateModeIndicator('recording');
          updateVoice('正在記錄家的位置，請保持GPS開啟...');
          
          const options = {
            enableHighAccuracy: true,
            timeout: 10000,
            maximumAge: 0
          };

          navigator.geolocation.getCurrentPosition(
            (position) => {
              this.homeLocation = {
                latitude: position.coords.latitude,
                longitude: position.coords.longitude,
                accuracy: position.coords.accuracy,
                timestamp: Date.now()
              };
              
              this.saveData();
              updateVoice(`家的位置已成功記錄！精確度${Math.round(position.coords.accuracy)}公尺`);
              document.getElementById('homeStatus').textContent = '已設定';
              this.updateModeIndicator('idle');
              resolve(this.homeLocation);
            },
            (error) => {
              const errorMsg = this.getGeolocationError(error);
              updateVoice(errorMsg);
              this.updateModeIndicator('idle');
              reject(errorMsg);
            },
            options
          );
        });
      }

      // 開始導航回家
      startNavigationHome() {
        if (!this.homeLocation) {
          updateVoice('請先設定家的位置');
          return;
        }

        if (!navigator.geolocation) {
          updateVoice('您的裝置不支援導航功能');
          return;
        }

        this.isNavigating = true;
        this.updateModeIndicator('navigating');
        updateVoice('開始導航回家，請跟隨語音指引');
        document.getElementById('navigationPanel').style.display = 'block';

        const options = {
          enableHighAccuracy: true,
          timeout: 5000,
          maximumAge: 0
        };

        this.watchId = navigator.geolocation.watchPosition(
          (position) => {
            this.updateNavigation(position);
          },
          (error) => {
            updateVoice('GPS信號不穩定，請移動到開闊處');
          },
          options
        );

        // 安全定時器：30分鐘後自動停止導航
        setTimeout(() => {
          if (this.isNavigating) {
            updateVoice('導航已超時，自動停止');
            this.stopNavigation();
          }
        }, 30 * 60 * 1000);
      }

      // 更新導航
      updateNavigation(position) {
        const currentLocation = {
          latitude: position.coords.latitude,
          longitude: position.coords.longitude,
          accuracy: position.coords.accuracy
        };

        const navInfo = this.calculateNavigationInfo(currentLocation, this.homeLocation);
        if (!navInfo) return;

        this.updateNavigationDisplay(navInfo);
        this.provideNavigationGuidance(navInfo);
      }

      // 計算導航資訊
      calculateNavigationInfo(current, target) {
        const R = 6371000;
        const φ1 = current.latitude * Math.PI/180;
        const φ2 = target.latitude * Math.PI/180;
        const Δφ = (target.latitude - current.latitude) * Math.PI/180;
        const Δλ = (target.longitude - current.longitude) * Math.PI/180;

        const a = Math.sin(Δφ/2) * Math.sin(Δφ/2) +
                  Math.cos(φ1) * Math.cos(φ2) * Math.sin(Δλ/2) * Math.sin(Δλ/2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        const distance = Math.round(R * c);

        const y = Math.sin(Δλ) * Math.cos(φ2);
        const x = Math.cos(φ1) * Math.sin(φ2) - 
                  Math.sin(φ1) * Math.cos(φ2) * Math.cos(Δλ);
        const θ = Math.atan2(y, x);
        const bearing = (θ * 180/Math.PI + 360) % 360;

        const direction = this.getDirectionFromBearing(bearing);

        // 計算ETA（估計到達時間），假設步行速度為 1.4 m/s
        const walkingSpeed = 1.4;
        const etaSeconds = Math.round(distance / walkingSpeed);
        const etaMinutes = Math.ceil(etaSeconds / 60);

        return { 
          distance, 
          bearing, 
          direction, 
          etaMinutes,
          accuracy: current.accuracy 
        };
      }

      // 獲取方向
      getDirectionFromBearing(bearing) {
        const directions = [
          { name: '北', start: 337.5, end: 22.5 },
          { name: '東北', start: 22.5, end: 67.5 },
          { name: '東', start: 67.5, end: 112.5 },
          { name: '東南', start: 112.5, end: 157.5 },
          { name: '南', start: 157.5, end: 202.5 },
          { name: '西南', start: 202.5, end: 247.5 },
          { name: '西', start: 247.5, end: 292.5 },
          { name: '西北', start: 292.5, end: 337.5 }
        ];

        for (const dir of directions) {
          if (bearing >= dir.start || bearing < dir.end) {
            return dir.name;
          }
        }
        return '北';
      }

      // 更新導航顯示
      updateNavigationDisplay(navInfo) {
        const { distance, direction } = navInfo;
        
        document.getElementById('distanceDisplay').textContent = distance + ' 公尺';
        
        const arrows = {
          '北': '↑', '東北': '↗', '東': '→', '東南': '↘',
          '南': '↓', '西南': '↙', '西': '←', '西北': '↖'
        };
        document.getElementById('directionArrow').textContent = arrows[direction] || '↑';
      }

      // 提供導航指引
      provideNavigationGuidance(navInfo) {
        const { distance, direction, etaMinutes } = navInfo;
        const now = Date.now();
        
        if (now - this.lastSpeechTime < this.SPEECH_COOLDOWN) return;

        let instruction = '';
        if (distance < 10) {
          instruction = '已到達目的地，導航結束';
          this.stopNavigation();
        } else if (distance < 50) {
          instruction = `快到家了，還有${distance}公尺，大約${etaMinutes}分鐘，請往${direction}走`;
        } else if (distance < 200) {
          instruction = `距離家${distance}公尺，大約${etaMinutes}分鐘，請往${direction}方向前進`;
        } else {
          instruction = `距離家${distance}公尺，大約${etaMinutes}分鐘，請往${direction}方向前進`;
        }

        updateVoice(instruction);
        document.getElementById('turnInstruction').textContent = instruction;
        this.lastSpeechTime = now;
      }

      // 停止導航
      stopNavigation() {
        if (this.watchId) {
          navigator.geolocation.clearWatch(this.watchId);
          this.watchId = null;
        }
        this.isNavigating = false;
        this.updateModeIndicator('idle');
        document.getElementById('navigationPanel').style.display = 'none';
        updateVoice('導航已停止');
      }

      // 設置相機
      async setupCamera() {
        const video = document.getElementById('video');
        
        // 如果已經有串流，直接返回
        if (video.srcObject) {
          document.getElementById('cameraOverlay').textContent = '鏡頭就緒';
          return video;
        }

        try {
          const constraints = {
            video: {
              facingMode: { ideal: 'environment' },
              width: { ideal: 640 },
              height: { ideal: 480 }
            }
          };

          const stream = await navigator.mediaDevices.getUserMedia(constraints);
          video.srcObject = stream;
          this.cameraStream = stream;
          
          return new Promise((resolve) => {
            video.onloadedmetadata = () => {
              video.play();
              document.getElementById('cameraOverlay').textContent = '鏡頭就緒';
              resolve(video);
            };
            
            // 安全超時
            setTimeout(() => {
              if (video.readyState >= 2) {
                document.getElementById('cameraOverlay').textContent = '鏡頭就緒';
                resolve(video);
              }
            }, 3000);
          });
        } catch (error) {
          console.error('相機錯誤:', error);
          
          // 嘗試使用前置鏡頭
          try {
            const constraints = {
              video: {
                facingMode: 'user',
                width: { ideal: 640 },
                height: { ideal: 480 }
              }
            };
            
            const stream = await navigator.mediaDevices.getUserMedia(constraints);
            video.srcObject = stream;
            document.getElementById('cameraOverlay').textContent = '鏡頭就緒（前置）';
            this.cameraStream = stream;
            return video;
          } catch (fallbackError) {
            updateVoice('無法開啟相機，請檢查相機權限設定');
            document.getElementById('cameraOverlay').textContent = '相機無法使用';
            return null;
          }
        }
      }

      // 停止相機
      stopCamera() {
        if (this.cameraStream) {
          this.cameraStream.getTracks().forEach(track => track.stop());
          this.cameraStream = null;
          const video = document.getElementById('video');
          video.srcObject = null;
        }
      }

      // 初始化分類篩選器
      initCategoryFilter() {
        const container = document.getElementById('categoryFilter');
        const categories = ['全部', ...Object.keys(itemDatabase)];
        
        container.innerHTML = categories.map(category => 
          `<button class="category-btn ${category === '全部' ? 'active' : ''}" 
                  onclick="assistant.setCategory('${category}')">${category}</button>`
        ).join('');
      }

      // 設定分類
      setCategory(category) {
        this.currentCategory = category;
        
        // 更新按鈕狀態
        document.querySelectorAll('.category-btn').forEach(btn => {
          btn.classList.remove('active');
        });
        event.target.classList.add('active');
        
        // 重新篩選顯示的物品
        this.filterDisplayedItems();
      }

      // 篩選顯示的物品
      filterDisplayedItems() {
        const searchTerm = document.getElementById('searchInput').value.toLowerCase();
        const filteredItems = this.lastItems.filter(item => {
          const matchesCategory = this.currentCategory === '全部' || 
                                item.category === this.currentCategory;
          const matchesSearch = item.name.toLowerCase().includes(searchTerm) ||
                              item.class.toLowerCase().includes(searchTerm);
          return matchesCategory && matchesSearch;
        });
        
        this.updateItemsDisplay(filteredItems);
      }

      // 更新物品顯示
      updateItemsDisplay(items) {
        const container = document.getElementById('itemsContainer');
        document.getElementById('itemCount').textContent = items.length;

        if (items.length === 0) {
          container.innerHTML = `
            <div class="item-card" style="background: #f1f2f6; color: #636e72; grid-column: 1/-1;">
              <div class="item-name">未識別到物品</div>
              <div class="item-confidence">請調整鏡頭方向或嘗試其他分類</div>
            </div>
          `;
          return;
        }

        container.innerHTML = items.map((item, index) => `
          <div class="item-card highlight" style="animation-delay: ${index * 0.1}s"
               onclick="assistant.speakItem('${item.name}')">
            <div class="item-name">${item.name}</div>
            <div class="item-confidence">可信度: ${Math.round(item.confidence * 100)}%</div>
            <div class="category-tag">${item.category}</div>
          </div>
        `).join('');
      }

      // 朗讀物品名稱
      speakItem(name) {
        if (this.voiceEnabled) {
          updateVoice(`這是${name}`);
        }
      }

      // 更新模式指示器
      updateModeIndicator(mode) {
        const indicator = document.getElementById('modeIndicator');
        const modeText = document.getElementById('currentMode');
        
        const modes = {
          'idle': { class: 'mode-idle', text: '待機中' },
          'identifying': { class: 'mode-identifying', text: '識別物品中' },
          'navigating': { class: 'mode-navigating', text: '導航中' },
          'recording': { class: 'mode-recording', text: '記錄中' }
        };

        indicator.className = 'mode-indicator ' + modes[mode].class;
        modeText.textContent = modes[mode].text;
      }

      // 獲取地理定位錯誤
      getGeolocationError(error) {
        switch(error.code) {
          case error.PERMISSION_DENIED: return '請允許位置權限，或檢查GPS是否開啟';
          case error.POSITION_UNAVAILABLE: return '無法獲取位置資訊，請移動到開闊處';
          case error.TIMEOUT: return '定位超時，請重試';
          default: return '定位服務暫時無法使用';
        }
      }

      // 切換記憶區顯示
      toggleMemorySection() {
        const section = document.getElementById('memorySection');
        section.style.display = section.style.display === 'none' ? 'block' : 'none';
      }

      // 清除歷史記錄
      clearHistory() {
        if (confirm('確定要清除所有識別記錄嗎？')) {
          this.recognitionHistory = [];
          this.updateHistoryDisplay();
          this.saveData();
          updateVoice('記錄已清除');
        }
      }
    }

    // 全域變數
    const assistant = new SimpleSmartAssistant();

    // 初始化
    async function init() {
      await assistant.initAll();
    }

    // 包裝函數
    function startItemRecognition() {
      assistant.startItemRecognition();
    }

    function toggleContinuousMode() {
      assistant.toggleContinuousMode();
    }

    function setHomeLocation() {
      assistant.setHomeLocation().catch(error => console.error(error));
    }

    function startNavigationHome() {
      assistant.startNavigationHome();
    }

    function toggleVoice() {
      const voiceEnabled = assistant.voiceEnabled = !assistant.voiceEnabled;
      const button = document.getElementById('voiceToggleBtn');
      if (voiceEnabled) {
        button.innerHTML = '<span class="button-icon">🔇</span><span class="button-text">關閉語音</span>';
        updateVoice('語音提示已開啟');
      } else {
        button.innerHTML = '<span class="button-icon">🔊</span><span class="button-text">開啟語音</span>';
        window.speechSynthesis.cancel();
      }
      assistant.saveData();
    }

    function toggleVoiceControl() {
      const toggle = document.getElementById('voiceControlToggle');
      assistant.toggleVoiceControl(toggle.checked);
    }

    function repeatInstruction() {
      const voiceAlert = document.getElementById('voiceAlert');
      if (voiceAlert.textContent && assistant.voiceEnabled) {
        updateVoice(voiceAlert.textContent);
      }
    }

    function filterItems() {
      assistant.filterDisplayedItems();
    }

    function toggleMemorySection() {
      assistant.toggleMemorySection();
    }

    function clearHistory() {
      assistant.clearHistory();
    }

    // 緊急聯絡功能
    function emergencyCall() {
      if (confirm('是否要撥打緊急聯絡電話？')) {
        updateVoice('正在撥打緊急聯絡電話');
        
        // 嘗試撥打電話
        const phoneNumber = '112';
        window.location.href = `tel:${phoneNumber}`;
        
        // 備用方案：顯示聯絡資訊
        setTimeout(() => {
          alert(`如無法自動撥號，請手動撥打：\n緊急聯絡：${phoneNumber}\n\n請告知您的緊急狀況和位置。`);
        }, 2000);
      }
    }

    // 語音提示
    function updateVoice(message) {
      const voiceAlert = document.getElementById('voiceAlert');
      voiceAlert.textContent = message;
      
      if (assistant.voiceEnabled && window.speechSynthesis) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(message);
        utterance.lang = 'zh-TW';
        utterance.rate = 0.9;
        utterance.pitch = 1.0;
        utterance.volume = 1.0;
        
        utterance.onstart = () => console.log('開始語音合成');
        utterance.onend = () => console.log('語音合成結束');
        utterance.onerror = (event) => console.warn('語音合成錯誤:', event);
        
        window.speechSynthesis.speak(utterance);
      }
    }

    // 離線支援
    window.addEventListener('online', () => {
      updateVoice('網路已恢復');
    });

    window.addEventListener('offline', () => {
      updateVoice('網路已斷開，部分功能可能受影響');
    });

    // 頁面可見性變化處理
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        // 頁面隱藏時暫停部分功能
        if (assistant.continuousMode) {
          assistant.stopContinuousMode();
        }
        if (assistant.isNavigating) {
          assistant.stopNavigation();
        }
        if (assistant.voiceControlEnabled) {
          assistant.stopVoiceRecognition();
        }
      } else {
        // 頁面恢復顯示時重新啟動語音辨識
        if (assistant.voiceControlEnabled && !assistant.isListening) {
          setTimeout(() => assistant.startVoiceRecognition(), 1000);
        }
      }
    });

    // 頁面卸載時清理資源
    window.addEventListener('beforeunload', () => {
      assistant.stopCamera();
      assistant.stopVoiceRecognition();
      if (assistant.isNavigating) {
        assistant.stopNavigation();
      }
    });

    // 頁面載入時初始化
    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
