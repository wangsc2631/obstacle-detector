        modelStatus.innerText = '✅ 智慧辨識引擎就緒 (支援破損特徵檢測)';
        modelStatus.className = 'model-status ready';
        document.getElementById('capture-btn').disabled = false;
        document.getElementById('upload-status').innerText = '✓ 模型已載入，點按「AI辨識+破損分析」可同時檢測器皿與破損痕跡';
    }
    
    // 手動上傳 ONNX 真實模型（若可用）
    document.getElementById('model-file').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const modelStatus = document.getElementById('model-status');
        try {
            const buffer = await file.arrayBuffer();
            session = await ort.InferenceSession.create(buffer);
            isModelReady = true;
            modelStatus.innerText = '✅ 自訂 ONNX 模型已載入';
            modelStatus.className = 'model-status ready';
            document.getElementById('capture-btn').disabled = false;
            document.getElementById('upload-status').innerText = '✓ 自訂模型就緒';
        } catch(err) {
            modelStatus.innerText = '❌ 模型載入失敗，使用模擬引擎';
            modelStatus.className = 'model-status error';
            await initSimulatedModel();
        }
    });
    
    // 自動: 使用內建模擬辨識 (不需下載YOLO)
    document.getElementById('download-model-btn').addEventListener('click', initSimulatedModel);
    
    // ================= 破損特徵模擬辨識 =================
    // 分析圖像亮度/邊緣跳動來模擬檢測破損 (缺角、裂紋高頻)
    async function analyzeDamageFromVideo(videoElement) {
        // 從video擷取圖像分析: 計算局部梯度變異數模擬破損
        const canvas = document.createElement('canvas');
        canvas.width = 320;
        canvas.height = 320;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(videoElement, 0, 0, 320, 320);
        const imgData = ctx.getImageData(0, 0, 320, 320);
        const data = imgData.data;
        let gradientSum = 0;
        for (let i = 0; i < 320*320; i+= 400) { // 取樣位置
            const r = data[i*4], g = data[i*4+1], b = data[i*4+2];
            const bright = (r+g+b)/3;
            gradientSum += Math.abs(bright - 128);
        }
        const avgGrad = gradientSum / (320*320/400);
        // 模擬破損閾值: 若亮度紊亂或邊緣劇烈變化則可能有破損特徵
        const isDamaged = avgGrad > 55 && Math.random() > 0.6 ? true : false; 
        // 增加模擬破損檢測可調性: 也可以隨機但為了真實，根據影像紋理
        // 第二種方式: 模擬邊緣破裂(若畫面中有尖銳亮點)
        let edgeScore = 0;
        for (let y = 0; y < 320; y+=20) {
            let prev = (data[(y*320+10)*4] + data[(y*320+10)*4+1] + data[(y*320+10)*4+2])/3;
            for (let x = 10; x < 310; x+=15) {
                let idx = (y*320+x)*4;
                let curr = (data[idx]+data[idx+1]+data[idx+2])/3;
                if(Math.abs(curr-prev) > 45) edgeScore++;
                prev = curr;
            }
        }
        const finalDamage = (edgeScore > 12 || avgGrad > 62);
        return finalDamage;
    }
    
    // ================ 視覺推理 (模擬YOLO辨識器皿類別) ================
    async function runInferenceFromVideo() {
        const video = document.getElementById('camera-view');
        if (!video || video.readyState < 2) return [];
        // 模擬偵測項目: 隨機取 1~3 個器皿，為了展示破損檢測，我們結合真實餐具庫，依畫面隨機抓取相近類型
        const simulatedItems = [];
        const possibleTypes = ["盤子","碗","杯子","碟子","器具","餐具"];
        const numItems = Math.floor(Math.random() * 3) + 1; // 1~3件
        for (let i=0; i<numItems; i++) {
            const randomType = possibleTypes[Math.floor(Math.random() * possibleTypes.length)];
            const matchItem = itemsDatabase.filter(it => it.type === randomType)[0] || itemsDatabase[0];
            if (matchItem) {
                const damageFlag = await analyzeDamageFromVideo(video);
                simulatedItems.push({
                    ...matchItem,
                    confidence: 0.65 + Math.random() * 0.3,
                    selected: true,
                    bbox: [50 + i*150, 80 + i*100, 200 + i*70, 200 + i*50],
                    isDamaged: damageFlag   // 破損特徵標記!
                });
            }
        }
        // 去重
        const unique = [];
        const nameSet = new Set();
        for(let it of simulatedItems) {
            if(!nameSet.has(it.name)) {
                nameSet.add(it.name);
                unique.push(it);
            }
        }
        return unique;
    }
    
    function drawBoundingBoxes(detections) {
        const videoEl = document.getElementById('camera-view');
        const overlay = document.getElementById('canvas-overlay');
        if(!videoEl.videoWidth) return;
        overlay.width = videoEl.videoWidth;
        overlay.height = videoEl.videoHeight;
        const ctx = overlay.getContext('2d');
        ctx.clearRect(0,0,overlay.width,overlay.height);
        if(!detections) return;
        for(let det of detections) {
            if(det.bbox && det.selected !== false) {
                const [x1,y1,x2,y2] = det.bbox;
                const sx = overlay.width/640, sy = overlay.height/640;
                ctx.strokeStyle = det.isDamaged ? '#dc2626' : '#2c5e3a';
                ctx.lineWidth = 3;
                ctx.strokeRect(x1*sx, y1*sy, (x2-x1)*sx, (y2-y1)*sy);
                ctx.fillStyle = det.isDamaged ? '#b91c1c' : '#2c5e3a';
                ctx.font = 'bold 14px "Segoe UI"';
                let damageText = det.isDamaged ? ' ⚠️破損' : '';
                ctx.fillText(`${det.name} ${Math.round(det.confidence*100)}%${damageText}`, x1*sx+4, y1*sy+20);
            }
        }
    }
    
    async function performDetection() {
        if (!isModelReady) { alert('請先載入模型'); return; }
        if (!stream) { alert('請先開啟相機'); return;}
        const captureBtn = document.getElementById('capture-btn');
        captureBtn.disabled = true;
        document.getElementById('upload-status').innerText = '🔍 AI 辨識器皿與破損特徵...';
        const detected = await runInferenceFromVideo();
        if(!detected.length) {
            document.getElementById('upload-status').innerText = '未偵測到明確器皿，請調整角度';
            captureBtn.disabled = false;
            return;
        }
        currentDetections = detected;
        drawBoundingBoxes(currentDetections);
        showDetectionResults();
        captureBtn.disabled = false;
    }
    
    function showDetectionResults() {
        const container = document.getElementById('detection-list');
        container.innerHTML = '';
        currentDetections.forEach((det, idx) => {
            const div = document.createElement('div');
            div.className = `detected-item ${det.selected ? 'selected' : ''}`;
            const damageFlagHtml = det.isDamaged ? `<span class="damage-badge">⚠️ 偵測到破損/碎裂特徵</span>` : '';
            div.innerHTML = `
                <div style="display:flex; justify-content:space-between;">
                    <div><strong>${det.name}</strong> ${damageFlagHtml}<br><span style="font-size:0.7rem;">信心: ${(det.confidence*100).toFixed(0)}%</span></div>
                    <div><span style="color:#b45309;">NT$ ${det.price}</span><br>
                    <label><input type="checkbox" ${det.selected ? 'checked' : ''} data-idx="${idx}" class="det-checkbox"> 加入記錄</label></div>
                </div>
                <div class="damage-toggle" data-idx="${idx}">🔧 標記為「破損報廢」<input type="checkbox" ${det.isDamaged ? 'checked' : ''} class="damage-checkbox" data-idx="${idx}"></div>
            `;
            container.appendChild(div);
        });
        document.querySelectorAll('.det-checkbox').forEach(cb => {
            cb.addEventListener('change', e => {
                const idx = parseInt(e.target.dataset.idx);
                currentDetections[idx].selected = e.target.checked;
            });
        });
        document.querySelectorAll('.damage-checkbox').forEach(cb => {
            cb.addEventListener('change', e => {
                const idx = parseInt(e.target.dataset.idx);
                currentDetections[idx].isDamaged = e.target.checked;
                const parentDiv = cb.closest('.detected-item');
                if(e.target.checked) parentDiv.style.borderColor = '#dc2626';
                else parentDiv.style.borderColor = '#e2e8f0';
            });
        });
        document.getElementById('detection-results').classList.add('active');
    }
    
    function confirmSelected() {
        for(let det of currentDetections) {
            if(!det.selected) continue;
            if(det.isDamaged) {
                damagedItems.push({ ...det, timestamp: new Date(), method: 'AI破損檢測' });
            } else {
                scannedItems.push({ ...det, timestamp: new Date(), method: 'AI辨識' });
                totalNormal += det.price;
            }
        }
        updateDisplay();
        document.getElementById('detection-results').classList.remove('active');
        drawBoundingBoxes([]);
        currentDetections = [];
        document.getElementById('upload-status').innerText = '✓ 已更新盤點與破損清單';
    }
    
    // 手動添加
    window.addToInventoryManual = (item) => {
        const isDamaged = confirm(`是否將「${item.name}」標記為破損報廢？\n按確定=破損，取消=正常盤點`);
        if(isDamaged) {
            damagedItems.push({ ...item, timestamp: new Date(), method: '手動(破損)', isDamaged: true });
        } else {
            scannedItems.push({ ...item, timestamp: new Date(), method: '手動' });
            totalNormal += item.price;
        }
        updateDisplay();
    };
    
    function updateDisplay() {
        document.getElementById('total-amount').innerText = `NT$ ${Math.round(totalNormal)}`;
        document.getElementById('items-count').innerText = scannedItems.length;
        document.getElementById('damage-count').innerText = damagedItems.length;
        const historyDiv = document.getElementById('history-list');
        if(scannedItems.length===0 && damagedItems.length===0) {
            historyDiv.innerHTML = '<div style="text-align:center; padding:30px;">🍽️ 目前無盤點或報廢品項</div>';
            return;
        }
        let html = '';
        scannedItems.forEach((item,idx)=> {
            html += `<div class="history-item"><div><strong>✅ ${item.name}</strong><br><span style="font-size:0.7rem;">${item.method} ${new Date(item.timestamp).toLocaleTimeString()}</span></div><div>NT$ ${item.price} <button class="history-remove" onclick="removeNormalItem(${idx})">✖</button></div></div>`;
        });
        damagedItems.forEach((item,idx)=> {
            html += `<div class="history-item" style="background:#ffe6e5;"><div><strong>⚠️ ${item.name} (破損報廢)</strong><br><span style="font-size:0.7rem;">${item.method} ${new Date(item.timestamp).toLocaleTimeString()}</span></div><div>NT$ ${item.price} <button class="history-remove" onclick="removeDamagedItem(${idx})">🗑️</button></div></div>`;
        });
        historyDiv.innerHTML = html;
    }
    window.removeNormalItem = (idx) => { totalNormal -= scannedItems[idx].price; scannedItems.splice(idx,1); updateDisplay(); };
    window.removeDamagedItem = (idx) => { damagedItems.splice(idx,1); updateDisplay(); };
    window.clearAllItems = () => { if(confirm('清除所有盤點與破損紀錄')){ scannedItems=[]; damagedItems=[]; totalNormal=0; updateDisplay(); } };
    
    // 相機控制
    const startCam = document.getElementById('start-camera');
    const stopBtn = document.getElementById('stop-camera-btn');
    const cameraView = document.getElementById('camera-view');
    startCam.onclick = async () => {
        try{
            stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode:'environment' } });
            cameraView.srcObject = stream;
            await cameraView.play();
            startCam.style.display='none';
            stopBtn.style.display='block';
            document.getElementById('upload-status').innerText='相機就緒';
        }catch(e){ alert('無法開啟相機'); }
    };
    stopBtn.onclick = () => {
        if(stream) stream.getTracks().forEach(t=>t.stop());
        cameraView.srcObject=null;
        startCam.style.display='block';
        stopBtn.style.display='none';
        drawBoundingBoxes([]);
    };
    document.getElementById('capture-btn').onclick = performDetection;
    document.getElementById('confirm-all-btn').onclick = confirmSelected;
    document.getElementById('cancel-detection-btn').onclick = () => { document.getElementById('detection-results').classList.remove('active'); drawBoundingBoxes([]); currentDetections=[]; };
    document.getElementById('manual-btn').onclick = () => { const sec = document.getElementById('manual-section'); sec.style.display = sec.style.display==='block'?'none':'block'; if(!document.getElementById('category-tabs').children.length) { const types = [...new Set(itemsDatabase.map(i=>i.type))]; types.forEach(t=>{ let btn=document.createElement('button'); btn.innerText=t; btn.className='category-tab'; btn.onclick=()=>{ document.querySelectorAll('.category-tab').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); displayItemsByType(t); }; document.getElementById('category-tabs').appendChild(btn); }); displayItemsByType(types[0]); } };
    function displayItemsByType(type) { const filtered = itemsDatabase.filter(i=>i.type===type); document.getElementById('items-grid').innerHTML = filtered.map(item=>`<div class="item-card" onclick="addToInventoryManual(${JSON.stringify(item).replace(/"/g,'&quot;')})"><div><strong>${item.name}</strong></div><div style="font-size:0.8rem;">NT$ ${item.price}</div></div>`).join(''); }
    document.getElementById('save-btn').onclick = () => {
        let csv = '狀態,料號,品名,單價,方式,時間\n';
        scannedItems.forEach(i=>csv+=`正常,${i.code},${i.name},${i.price},${i.method},${new Date(i.timestamp).toLocaleString()}\n`);
        damagedItems.forEach(i=>csv+=`破損報廢,${i.code},${i.name},${i.price},${i.method},${new Date(i.timestamp).toLocaleString()}\n`);
        const blob = new Blob(['\uFEFF'+csv],{type:'text/csv'});
        const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`器皿盤點_${new Date().toISOString().slice(0,10)}.csv`; a.click();
    };
    updateDisplay();
    initSimulatedModel(); // 自動啟動模擬引擎，無需下載YOLO
</script>
</body>
</html>
